<body class="app-page">

    <p id="error" class="error app-error" role="alert" hidden></p>
    <button id="retry" class="secondary-button" type="button" hidden>Volver a intentar</button>

    <div id="app" class="app-layout" hidden>
        <aside class="sidebar">
            <a class="brand" href="/" aria-label="RCC, inicio"><span class="brand-symbol" aria-hidden="true">+</span> RCC</a>
            <p class="nav-heading">MI ESPACIO</p>
            <nav aria-label="Navegación principal">

            </nav>

                <span class="avatar" aria-hidden="true">♡</span>
                <div class="user-details"><span data-display-name></span><button id="logout" type="button">Cerrar sesión</button></div>

        </aside>
        <main class="main-content">
            <header class="app-header"><p>Tu espacio personal</p><span class="header-tag">RCC</span></header>
